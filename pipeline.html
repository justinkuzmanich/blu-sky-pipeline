<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline — Blu Sky CRM</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:       #F7F4EF;
      --cream-dark:  #E5DFD5;
      --cream-mid:   #CEC7BA;
      --border:      #B8B0A2;
      --border-light:#CBBFB2;
      --text-1:      #1C1917;
      --text-2:      #57534E;
      --text-3:      #A8A29E;
      --text-4:      #C7C3BC;
      --white:       #FFFFFF;
      --shadow-sm:   0 2px 6px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md:   0 4px 14px rgba(0,0,0,0.13), 0 2px 4px rgba(0,0,0,0.07);
      --shadow-lg:   0 12px 36px rgba(0,0,0,0.18), 0 4px 8px rgba(0,0,0,0.08);
      --card-shadow: 0 2px 8px rgba(0,0,0,0.11), 0 1px 2px rgba(0,0,0,0.07);
    }
    html, body, #root { height: 100%; margin: 0; padding: 0; background: var(--cream); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--cream-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    input, textarea, button { outline: none; font-family: inherit; }
    textarea { resize: none; }
    .deal-card { transition: transform 0.15s ease; }
    .deal-card:hover { transform: translateY(-2px); }
    .move-btn { opacity: 0; transition: opacity 0.12s; }
    .deal-card:hover .move-btn { opacity: 1; }
    .note-del { opacity: 0; transition: opacity 0.12s; }
    .note-row:hover .note-del { opacity: 1; }
    .tab-btn { transition: color 0.15s, border-color 0.15s; }
    .add-here { transition: border-color 0.15s, background 0.15s; }
    .add-here:hover { background: rgba(255,255,255,0.5) !important; border-color: #9A9088 !important; color: #7A7068 !important; }
    .stage-pill-btn { transition: all 0.12s; }
    .stage-pill-btn:hover { background: var(--cream-dark) !important; }
    .drop-zone { transition: background 0.15s, box-shadow 0.15s; }
    .drop-zone.drag-over { background: #D4CFBA !important; box-shadow: inset 0 0 0 2px #8B7D5E !important; }
    .deal-card[draggable="true"] { cursor: grab; }
    .deal-card[draggable="true"]:active { cursor: grabbing; opacity: 0.7; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const DEFAULT_STAGES = ["Prospect", "Qualified", "Proposal", "Negotiation", "Closed"];
  const STORAGE_KEY = "blu-pipeline-v3";

  const DEAL_TYPES = [
    { key: "video",   label: "Video",        icon: "🎬", color: "#B45309", bg: "#FEF3C7" },
    { key: "website", label: "Website",      icon: "🌐", color: "#1D4ED8", bg: "#DBEAFE" },
    { key: "social",  label: "Social Media", icon: "📱", color: "#6D28D9", bg: "#EDE9FE" },
    { key: "ads",     label: "Paid Ads",     icon: "📢", color: "#B91C1C", bg: "#FEE2E2" },
    { key: "photo",   label: "Photography",  icon: "📷", color: "#065F46", bg: "#D1FAE5" },
    { key: "consult", label: "Consulting",   icon: "💡", color: "#92400E", bg: "#FDE68A" },
    { key: "other",   label: "Other",        icon: "·",  color: "#57534E", bg: "#F5F5F4" },
  ];

  const STEP_TYPES = [
    { key: "call",     label: "Call",       icon: "📞" },
    { key: "text",     label: "Text",       icon: "💬" },
    { key: "email",    label: "Email",      icon: "✉️"  },
    { key: "meet",     label: "Meet",       icon: "🤝" },
    { key: "demo",     label: "Demo",       icon: "🖥️" },
    { key: "followup", label: "Follow Up",  icon: "🔁" },
  ];

  // Stage accent colors — warm, refined
  const STAGE_COLORS = ["#3B7DD8","#7C5DC7","#C97B2E","#C0392B","#2D8A5E"];
  const STAGE_BG     = ["#EEF4FF","#F3EFFE","#FEFCE8","#FEF2F2","#ECFDF5"];

  const fmt$ = (val) => {
    const n = parseFloat(val);
    if (!n || isNaN(n)) return "—";
    return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  };

  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso), now = new Date();
    const diff = Math.ceil((d - now) / 86400000);
    const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const date = d.toLocaleDateString([], { month: "short", day: "numeric" });
    if (diff === 0) return `Today ${time}`;
    if (diff === 1) return `Tomorrow ${time}`;
    if (diff < 0)  return `${Math.abs(diff)}d overdue`;
    if (diff < 7)  return `${date} ${time}`;
    return date;
  };

  const isOverdue = (iso) => iso && new Date(iso) < new Date();
  const noteFmt = (ts) => new Date(ts).toLocaleDateString([], { month: "short", day: "numeric" }) + " · " + new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const uid = () => Math.random().toString(36).slice(2, 10);

  const store = {
    get: (k) => { try { const v = localStorage.getItem(k); return v ? { value: v } : null; } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  // ─── Label ───────────────────────────────────────────────
  const Label = ({ children }) => (
    <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.7px", textTransform: "uppercase", color: "var(--text-3)", marginBottom: 5 }}>{children}</div>
  );

  // ─── FieldInput ──────────────────────────────────────────
  const FieldInput = ({ type, value, onChange, placeholder, mono, onKeyDown, inputRef }) => (
    <input ref={inputRef} type={type || "text"} value={value || ""} onChange={onChange} onKeyDown={onKeyDown} placeholder={placeholder}
      style={{ width: "100%", background: "var(--white)", border: "1px solid var(--border)", borderRadius: 7, padding: "8px 11px", color: "var(--text-1)", fontSize: 13, fontFamily: mono ? "'DM Mono',monospace" : "inherit", boxShadow: "var(--shadow-sm)" }} />
  );

  // ─── TodayCard ────────────────────────────────────────────
  function TodayCard({ d, stages, onOpen, onClear, overdue, noStep }) {
    const ns = d.nextStep;
    const st = STEP_TYPES.find(t => t.key === ns?.type);
    const dt = DEAL_TYPES.find(t => t.key === d.dealType);
    const stageName = stages[d.stage] || "";
    const stageColor = STAGE_COLORS[d.stage] || STAGE_COLORS[0];
    const stageBg    = STAGE_BG[d.stage]     || STAGE_BG[0];
    return (
      <div style={{ background:"var(--white)", border:`1px solid ${overdue ? "#FECACA" : "var(--border-light)"}`, borderRadius:10, padding:"13px 16px", marginBottom:8, display:"flex", alignItems:"center", gap:14, boxShadow:"var(--shadow-sm)" }}>
        {/* Action icon */}
        <div style={{ width:36, height:36, borderRadius:8, background: overdue ? "#FEE2E2" : noStep ? "var(--cream-dark)" : "#FEF3C7", display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, flexShrink:0 }}>
          {noStep ? "·" : st?.icon || "📋"}
        </div>
        {/* Info */}
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:3 }}>
            <span style={{ fontWeight:600, fontSize:14, color:"var(--text-1)" }}>{d.name}</span>
            {d.business && <span style={{ fontSize:12, color:"var(--text-3)" }}>{d.business}</span>}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
            <span style={{ fontSize:11, background:stageBg, color:stageColor, border:`1px solid ${stageColor}33`, borderRadius:20, padding:"1px 7px", fontWeight:600 }}>{stageName}</span>
            {dt && <span style={{ fontSize:10, background:dt.bg, color:dt.color, borderRadius:4, padding:"1px 6px", fontWeight:600 }}>{dt.icon} {dt.label}</span>}
            {d.value > 0 && <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color:stageColor, fontWeight:600 }}>{fmt$(d.value)}</span>}
            {ns && <span style={{ fontSize:11, color: overdue ? "#B91C1C" : "var(--text-3)" }}>{overdue ? "⚠ " : "🕐 "}{fmtDate(ns.reminderAt)}</span>}
            {ns?.note && <span style={{ fontSize:11, color:"var(--text-3)", fontStyle:"italic" }}>"{ns.note}"</span>}
          </div>
        </div>
        {/* Actions */}
        <div style={{ display:"flex", gap:6, flexShrink:0 }}>
          <button onClick={()=>onOpen(d.id,"nextstep")}
            style={{ padding:"5px 11px", background:"var(--cream)", border:"1px solid var(--border)", borderRadius:6, fontSize:12, color:"var(--text-2)", fontWeight:500, cursor:"pointer" }}>
            {noStep ? "+ Add Step" : "Edit"}
          </button>
          {!noStep && <button onClick={onClear}
            style={{ padding:"5px 11px", background:"#F0FDF4", border:"1px solid #BBF7D0", borderRadius:6, fontSize:12, color:"#15803D", fontWeight:600, cursor:"pointer" }}>
            ✓ Done
          </button>}
        </div>
      </div>
    );
  }

  // ─── Main ─────────────────────────────────────────────────
  function Pipeline() {
    const [stages, setStages]           = useState(DEFAULT_STAGES);
    const [deals, setDeals]             = useState([]);
    const [showForm, setShowForm]       = useState(false);
    const [editingStage, setEditingStage] = useState(null);
    const [stageInput, setStageInput]   = useState("");
    const [panelId, setPanelId]         = useState(null);
    const [activeTab, setActiveTab]     = useState("notes");
    const [form, setForm]               = useState({ name:"", business:"", phone:"", email:"", value:"" });
    const [formStage, setFormStage]     = useState(0);
    const [formType, setFormType]       = useState("");
    const [loaded, setLoaded]           = useState(false);
    const [newNote, setNewNote]         = useState("");
    const [nsDraft, setNsDraft]         = useState(null);
    const [dragId, setDragId]           = useState(null);
    const [dragOver, setDragOver]       = useState(null);
    const [view, setView]               = useState("board"); // "board" | "today"
    const nameRef = useRef(null);
    const noteRef = useRef(null);

    useEffect(() => {
      try {
        const s = store.get(STORAGE_KEY);
        if (s?.value) { const d = JSON.parse(s.value); if (d.stages) setStages(d.stages); if (d.deals) setDeals(d.deals); }
      } catch {}
      setLoaded(true);
    }, []);

    useEffect(() => {
      if (loaded) store.set(STORAGE_KEY, JSON.stringify({ stages, deals }));
    }, [stages, deals, loaded]);

    useEffect(() => { if (showForm) setTimeout(() => nameRef.current?.focus(), 50); }, [showForm]);

    const deal = deals.find(d => d.id === panelId) || null;
    const stageColor = deal ? (STAGE_COLORS[deal.stage] || STAGE_COLORS[0]) : STAGE_COLORS[0];

    const upd  = (id, p) => setDeals(d => d.map(x => x.id === id ? { ...x, ...p } : x));
    const move = (id, dir) => setDeals(d => d.map(x => x.id === id ? { ...x, stage: Math.max(0, Math.min(stages.length - 1, x.stage + dir)) } : x));
    const del  = (id) => { setDeals(d => d.filter(x => x.id !== id)); setPanelId(null); };

    const addDeal = () => {
      if (!form.name.trim()) return;
      setDeals(d => [{ id: uid(), stage: formStage, dealType: formType, name: form.name.trim(), business: form.business.trim(), phone: form.phone.trim(), email: form.email.trim(), value: parseFloat(form.value) || 0, notes: [], nextStep: null, createdAt: Date.now() }, ...d]);
      setForm({ name:"", business:"", phone:"", email:"", value:"" }); setFormType(""); setShowForm(false);
    };

    const addNote = () => {
      if (!newNote.trim() || !deal) return;
      upd(deal.id, { notes: [{ id: uid(), text: newNote.trim(), ts: Date.now(), stage: stages[deal.stage] }, ...(deal.notes||[])] });
      setNewNote(""); setTimeout(() => noteRef.current?.focus(), 50);
    };

    const saveNs = () => { if (!deal || !nsDraft?.type) return; upd(deal.id, { nextStep: nsDraft }); setNsDraft(null); };
    const clearNs = () => { upd(deal.id, { nextStep: null }); setNsDraft(null); };

    const openPanel = (id, tab) => { setPanelId(id); setActiveTab(tab||"notes"); setNsDraft(null); setNewNote(""); };
    const startEditStage = (i) => { setEditingStage(i); setStageInput(stages[i]); };
    const saveStage = () => { if (editingStage === null) return; setStages(s => s.map((x,i) => i===editingStage ? stageInput||x : x)); setEditingStage(null); };

    // Totals
    const stageTotal   = (i) => deals.filter(d => d.stage===i).reduce((s,d) => s+d.value, 0);
    const grandTotal   = deals.reduce((s,d) => s+d.value, 0);
    const activeTotal  = deals.filter(d => d.stage < stages.length-1).reduce((s,d) => s+d.value, 0);
    const closedTotal  = deals.filter(d => d.stage === stages.length-1).reduce((s,d) => s+d.value, 0);
    const overdueCount = deals.filter(d => d.nextStep && isOverdue(d.nextStep.reminderAt)).length;
    const winRate      = deals.length > 0 ? Math.round(deals.filter(d => d.stage===stages.length-1).length / deals.length * 100) : 0;

    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const todayEnd   = new Date(); todayEnd.setHours(23,59,59,999);
    const isDueToday = (iso) => { if (!iso) return false; const d = new Date(iso); return d >= todayStart && d <= todayEnd; };
    const overdueDeals  = deals.filter(d => d.nextStep?.reminderAt && isOverdue(d.nextStep.reminderAt));
    const todayDeals    = deals.filter(d => d.nextStep?.reminderAt && isDueToday(d.nextStep.reminderAt));
    const noStepDeals   = deals.filter(d => !d.nextStep && d.stage < stages.length - 1);

    return (
      <div style={{ height:"100vh", background:"var(--cream)", color:"var(--text-1)", fontFamily:"'DM Sans',sans-serif", display:"flex", flexDirection:"column", overflow:"hidden" }}>

        {/* ── TOP BAR ── */}
        <div style={{ background:"#FFFFFF", borderBottom:"1px solid #E8E2D9", padding:"0 24px", display:"flex", alignItems:"center", justifyContent:"flex-start", height:52, flexShrink:0, boxShadow:"0 1px 3px rgba(0,0,0,0.06)" }}>
          <span style={{ fontFamily:"'Libre Baskerville',serif", fontWeight:700, fontSize:17, color:"var(--text-1)", letterSpacing:"-0.3px", marginRight:20 }}>Blu Sky Pipeline</span>
          <button onClick={() => { setShowForm(true); setFormStage(0); }}
            style={{ background:"#C96A1F", color:"#FFFFFF", border:"none", borderRadius:7, padding:"6px 14px", fontSize:13, fontWeight:600, display:"flex", alignItems:"center", gap:5, cursor:"pointer", letterSpacing:"0.1px", marginRight:24, boxShadow:"0 1px 4px rgba(201,106,31,0.35)" }}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Lead
          </button>
          {/* Text nav */}
          <nav style={{ display:"flex", alignItems:"center", gap:20 }}>
            {[["board","Pipeline"],["today","Today View"]].map(([v, label]) => (
              <button key={v} onClick={()=>setView(v)}
                style={{ background:"none", border:"none", borderBottom:`2px solid ${view===v ? "var(--text-1)" : "transparent"}`, color:"var(--text-1)", fontSize:13, fontWeight: view===v ? 600 : 400, cursor:"pointer", padding:"4px 0", letterSpacing:"0.1px", transition:"border-color 0.15s" }}>
                {label}
              </button>
            ))}
          </nav>
          {overdueCount > 0 && (
            <span style={{ fontSize:11, color:"#B91C1C", fontWeight:600, background:"#FEE2E2", border:"1px solid #FECACA", borderRadius:20, padding:"2px 9px", marginLeft:16 }}>⚠ {overdueCount} overdue</span>
          )}
        </div>

        {/* ── SUMMARY BAR ── */}
        <div style={{ background:"var(--white)", borderBottom:"1px solid var(--border-light)", padding:"14px 24px", display:"flex", alignItems:"center", gap:0, flexShrink:0 }}>
          {/* Grand total */}
          <div style={{ minWidth:160, paddingRight:28 }}>
            <div style={{ fontSize:10, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.8px", fontWeight:600, marginBottom:3 }}>Total Pipeline</div>
            <div style={{ fontFamily:"'Libre Baskerville',serif", fontSize:24, fontWeight:700, color:"var(--text-1)", letterSpacing:"-0.5px", lineHeight:1 }}>{fmt$(grandTotal)}</div>
            <div style={{ fontSize:11, color:"var(--text-3)", marginTop:4 }}>{deals.length} deal{deals.length !== 1 ? "s" : ""}</div>
          </div>

          <div style={{ width:1, background:"var(--border-light)", alignSelf:"stretch", marginRight:28 }} />

          {/* Stage bar */}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:10, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.8px", fontWeight:600, marginBottom:8 }}>By Stage</div>
            <div style={{ display:"flex", height:4, borderRadius:4, overflow:"hidden", background:"var(--cream-dark)", marginBottom:10 }}>
              {stages.map((_, si) => {
                const pct = grandTotal > 0 ? (stageTotal(si) / grandTotal) * 100 : 0;
                return pct > 0 ? <div key={si} style={{ width:pct+"%", background:STAGE_COLORS[si], transition:"width 0.4s ease" }} /> : null;
              })}
            </div>
            {/* Labels pinned to the start of each segment */}
            <div style={{ position:"relative", height:22 }}>
              {(() => {
                let cumPct = 0;
                return stages.map((s, si) => {
                  const pct = grandTotal > 0 ? (stageTotal(si) / grandTotal) * 100 : 0;
                  const count = deals.filter(d => d.stage===si).length;
                  const left = cumPct;
                  cumPct += pct;
                  if (!count || pct === 0) return null;
                  return (
                    <div key={si} style={{ position:"absolute", left:left+"%", top:0, display:"flex", alignItems:"center", gap:5, transform: left > 72 ? "translateX(-100%)" : "none", whiteSpace:"nowrap" }}>
                      <div style={{ width:6, height:6, borderRadius:"50%", background:STAGE_COLORS[si], flexShrink:0 }} />
                      <span style={{ fontSize:11, color:"var(--text-2)" }}>{s}</span>
                      <span style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color: si===stages.length-1 ? "#2D8A5E" : "var(--text-1)", fontWeight:500 }}>{fmt$(stageTotal(si))}</span>
                      <span style={{ fontSize:10, color:"var(--text-4)" }}>({count})</span>
                    </div>
                  );
                });
              })()}
            </div>
          </div>

          <div style={{ width:1, background:"var(--border-light)", alignSelf:"stretch", margin:"0 28px" }} />

          {/* KPIs */}
          <div style={{ display:"flex", gap:28, flexShrink:0 }}>
            {[["Active", fmt$(activeTotal), "var(--text-1)"], ["Won", fmt$(closedTotal), "#2D8A5E"], ["Win Rate", winRate+"%", winRate > 0 ? "#2D8A5E" : "var(--text-3)"]].map(([label, val, col]) => (
              <div key={label} style={{ textAlign:"center" }}>
                <div style={{ fontSize:10, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.8px", fontWeight:600, marginBottom:5 }}>{label}</div>
                <div style={{ fontFamily:"'DM Mono',monospace", fontSize:14, color:col, fontWeight:500 }}>{val}</div>
              </div>
            ))}
          </div>
        </div>

        {/* ── BODY ── */}
        <div style={{ flex:1, display:"flex", overflow:"hidden" }}>

          {/* ── TODAY VIEW ── */}
          {view === "today" && (
            <div style={{ flex:1, overflowY:"auto", padding:"24px 28px", background:"var(--cream)" }}>
              <div style={{ maxWidth:680, margin:"0 auto" }}>

                {/* Overdue */}
                {overdueDeals.length > 0 && (
                  <div style={{ marginBottom:28 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                      <span style={{ fontSize:13, fontWeight:700, color:"#B91C1C", fontFamily:"'Libre Baskerville',serif" }}>⚠ Overdue</span>
                      <span style={{ fontSize:11, background:"#FEE2E2", color:"#B91C1C", border:"1px solid #FECACA", borderRadius:20, padding:"1px 8px", fontWeight:600 }}>{overdueDeals.length}</span>
                    </div>
                    {overdueDeals.map(d => <TodayCard key={d.id} d={d} stages={stages} onOpen={openPanel} onClear={()=>upd(d.id,{nextStep:null})} overdue />)}
                  </div>
                )}

                {/* Due Today */}
                {todayDeals.length > 0 && (
                  <div style={{ marginBottom:28 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                      <span style={{ fontSize:13, fontWeight:700, color:"#92400E", fontFamily:"'Libre Baskerville',serif" }}>☀️ Due Today</span>
                      <span style={{ fontSize:11, background:"#FEF3C7", color:"#92400E", border:"1px solid #FDE68A", borderRadius:20, padding:"1px 8px", fontWeight:600 }}>{todayDeals.length}</span>
                    </div>
                    {todayDeals.map(d => <TodayCard key={d.id} d={d} stages={stages} onOpen={openPanel} onClear={()=>upd(d.id,{nextStep:null})} />)}
                  </div>
                )}

                {/* No next step */}
                {noStepDeals.length > 0 && (
                  <div style={{ marginBottom:28 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
                      <span style={{ fontSize:13, fontWeight:700, color:"var(--text-2)", fontFamily:"'Libre Baskerville',serif" }}>· No Next Step</span>
                      <span style={{ fontSize:11, background:"var(--cream-dark)", color:"var(--text-3)", border:"1px solid var(--border-light)", borderRadius:20, padding:"1px 8px", fontWeight:600 }}>{noStepDeals.length}</span>
                    </div>
                    {noStepDeals.map(d => <TodayCard key={d.id} d={d} stages={stages} onOpen={openPanel} noStep />)}
                  </div>
                )}

                {overdueDeals.length === 0 && todayDeals.length === 0 && noStepDeals.length === 0 && (
                  <div style={{ textAlign:"center", paddingTop:60 }}>
                    <div style={{ fontSize:36, marginBottom:12 }}>✅</div>
                    <div style={{ fontFamily:"'Libre Baskerville',serif", fontSize:17, color:"var(--text-1)", fontWeight:700, marginBottom:6 }}>All clear</div>
                    <div style={{ fontSize:13, color:"var(--text-3)" }}>No overdue or pending next steps today.</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── BOARD ── */}
          {view === "board" && (
          <div style={{ flex:1, display:"flex", overflowX:"auto", overflowY:"hidden", padding:"18px 14px", alignItems:"flex-start", background:"#BDB4A6" }}>
            {stages.map((stage, si) => {
              const dot   = STAGE_COLORS[si] || STAGE_COLORS[0];
              const sbg   = STAGE_BG[si]     || STAGE_BG[0];
              const stDeals = deals.filter(d => d.stage===si);
              const isLast  = si === stages.length - 1;
              return (
                <div key={si}
                  className={`drop-zone${dragOver === si ? " drag-over" : ""}`}
                  onDragOver={e => { e.preventDefault(); setDragOver(si); }}
                  onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
                  onDrop={e => { e.preventDefault(); if (dragId) { setDeals(d => d.map(x => x.id === dragId ? { ...x, stage: si } : x)); } setDragId(null); setDragOver(null); }}
                  style={{ flex:"0 0 232px", margin:"0 6px", background:"#EDE8E0", borderRadius:12, border:"1px solid #B0A898", display:"flex", flexDirection:"column", maxHeight:"100%", minHeight:260, boxShadow:"0 2px 8px rgba(0,0,0,0.14), 0 1px 2px rgba(0,0,0,0.08)" }}>
                  {/* Col header */}
                  <div style={{ padding:"11px 13px 9px", borderBottom:"1px solid #C8C1B4" }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:6 }}>
                      {editingStage === si ? (
                        <input autoFocus value={stageInput} onChange={e=>setStageInput(e.target.value)} onBlur={saveStage} onKeyDown={e=>e.key==="Enter"&&saveStage()}
                          style={{ background:"transparent", border:"none", color:"var(--text-1)", fontSize:15, fontWeight:700, fontFamily:"'Libre Baskerville',serif", width:"100%" }} />
                      ) : (
                        <div onClick={()=>startEditStage(si)} title="Click to rename"
                          style={{ fontFamily:"'Libre Baskerville',serif", fontWeight:700, fontSize:15, color:"var(--text-1)", cursor:"text", flex:1, userSelect:"none" }}>{stage}</div>
                      )}
                      <span style={{ background:sbg, color:dot, border:`1px solid ${dot}33`, borderRadius:20, padding:"1px 8px", fontSize:10, fontWeight:700, flexShrink:0 }}>{stDeals.length}</span>
                    </div>
                    {stDeals.length > 0 && (
                      <div style={{ fontSize:11, fontFamily:"'DM Mono',monospace", color: isLast ? "#2D8A5E" : "var(--text-2)", marginTop:4, fontWeight:500 }}>{fmt$(stageTotal(si))}</div>
                    )}
                  </div>

                  {/* Cards */}
                  <div style={{ flex:1, overflowY:"auto", padding:"8px 8px 0", background:"#E6E0D6", borderRadius:"0 0 0 0" }}>
                    {stDeals.length === 0 && (
                      <div style={{ textAlign:"center", color:"var(--text-4)", fontSize:11, marginTop:24, fontStyle:"italic" }}>No leads yet</div>
                    )}
                    {stDeals.map(d => {
                      const ns = d.nextStep;
                      const od = ns?.reminderAt && isOverdue(ns.reminderAt);
                      const st = STEP_TYPES.find(t => t.key===ns?.type);
                      const dt = DEAL_TYPES.find(t => t.key===d.dealType);
                      return (
                        <div key={d.id} className="deal-card"
                          draggable="true"
                          onDragStart={e => { setDragId(d.id); e.dataTransfer.effectAllowed = "move"; }}
                          onDragEnd={() => { setDragId(null); setDragOver(null); }}
                          onClick={()=>openPanel(d.id)}
                          style={{ background:"#FFFFFF", border:`1px solid ${panelId===d.id ? dot : "#D4CDC3"}`, borderRadius:9, padding:"11px 12px", marginBottom:6, cursor:"grab", opacity: dragId===d.id ? 0.45 : 1, transition:"opacity 0.15s" }}>
                          <div style={{ display:"flex", justifyContent:"space-between", gap:6, alignItems:"flex-start" }}>
                            <div style={{ flex:1, minWidth:0 }}>
                              <div style={{ fontWeight:600, fontSize:15.5, color:"var(--text-1)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{d.name}</div>
                              {d.business && <div style={{ fontSize:14, color:"var(--text-3)", marginTop:1, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{d.business}</div>}
                            </div>
                            <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:3, flexShrink:0 }}>
                              {d.value > 0 && <div style={{ fontFamily:"'DM Mono',monospace", fontSize:11, color:dot, fontWeight:600 }}>{fmt$(d.value)}</div>}
                              {dt && <span style={{ fontSize:9, background:dt.bg, color:dt.color, borderRadius:4, padding:"1px 5px", fontWeight:600 }}>{dt.icon} {dt.label}</span>}
                            </div>
                          </div>

                          {ns && (
                            <div style={{ marginTop:8 }}>
                              <span style={{ fontSize:10, background: od?"#FEE2E2":"var(--cream)", border:`1px solid ${od?"#FECACA":"var(--border)"}`, borderRadius:4, padding:"2px 7px", color: od?"#B91C1C":"var(--text-2)", display:"inline-flex", alignItems:"center", gap:4 }}>
                                {st?.icon} {st?.label}
                                {ns.reminderAt && <span style={{ fontFamily:"'DM Mono',monospace", fontSize:9, color: od?"#B91C1C":"var(--text-3)" }}>· {fmtDate(ns.reminderAt)}</span>}
                              </span>
                            </div>
                          )}

                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:8 }}>
                            <div>
                              {(d.notes||[]).length > 0 && (
                                <span style={{ fontSize:9, color:"var(--text-3)", background:"var(--cream)", borderRadius:4, padding:"1px 6px", border:"1px solid var(--border-light)" }}>📝 {d.notes.length}</span>
                              )}
                            </div>
                            <div style={{ display:"flex", gap:1 }} onClick={e=>e.stopPropagation()}>
                              {si > 0 && <button className="move-btn" onClick={()=>move(d.id,-1)} style={{ background:"none", border:"none", color:"var(--text-3)", fontSize:14, padding:"1px 5px", borderRadius:4, cursor:"pointer" }}>←</button>}
                              {si < stages.length-1 && <button className="move-btn" onClick={()=>move(d.id,1)} style={{ background:"none", border:"none", color:dot, fontSize:14, fontWeight:700, padding:"1px 5px", borderRadius:4, cursor:"pointer" }}>→</button>}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Add here */}
                  <div style={{ padding:"6px 8px 9px", flexShrink:0, background:"#E6E0D6", borderRadius:"0 0 12px 12px" }}>
                    <button className="add-here" onClick={()=>{ setFormStage(si); setShowForm(true); }}
                      style={{ width:"100%", background:"transparent", border:"1px dashed #7A6F62", borderRadius:7, color:"#6B6057", padding:"6px", fontSize:11, display:"flex", alignItems:"center", justifyContent:"center", gap:4, cursor:"pointer" }}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      Add here
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
          )} {/* end board view */}

          {/* ── SIDE PANEL ── */}
          {deal && (
            <div style={{ width:376, flexShrink:0, background:"var(--white)", borderLeft:"1px solid var(--border-light)", display:"flex", flexDirection:"column", overflow:"hidden", boxShadow:"-4px 0 16px rgba(0,0,0,0.04)" }}>
              {/* Panel header */}
              <div style={{ padding:"16px 18px 12px", borderBottom:"1px solid var(--border-light)", flexShrink:0 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontFamily:"'Libre Baskerville',serif", fontWeight:700, fontSize:17, color:"var(--text-1)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{deal.name}</div>
                    <div style={{ color:"var(--text-3)", fontSize:12, marginTop:2 }}>{deal.business || "—"}</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0, marginLeft:10 }}>
                    {deal.dealType && (() => { const dt = DEAL_TYPES.find(t=>t.key===deal.dealType); return dt ? <span style={{ fontSize:10, background:dt.bg, color:dt.color, borderRadius:5, padding:"2px 8px", fontWeight:600 }}>{dt.icon} {dt.label}</span> : null; })()}
                    {deal.value > 0 && <div style={{ fontFamily:"'DM Mono',monospace", fontSize:13, color:stageColor, fontWeight:600 }}>{fmt$(deal.value)}</div>}
                    <button onClick={()=>setActiveTab("contact")} title="Edit deal" style={{ background:"none", border:"1px solid var(--border)", borderRadius:6, color:"var(--text-3)", fontSize:13, lineHeight:1, cursor:"pointer", padding:"3px 7px" }}>✏️</button>
                    <button onClick={()=>setPanelId(null)} style={{ background:"none", border:"none", color:"var(--text-3)", fontSize:20, lineHeight:1, cursor:"pointer", padding:"0 2px" }}>×</button>
                  </div>
                </div>
                {/* Stage pills */}
                <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                  {stages.map((s,i) => {
                    const active = deal.stage===i;
                    return (
                      <button key={i} className="stage-pill-btn" onClick={()=>upd(deal.id,{stage:i})}
                        style={{ padding:"3px 10px", borderRadius:20, border:`1px solid ${active ? STAGE_COLORS[i] : "var(--border)"}`, background: active ? STAGE_BG[i] : "transparent", color: active ? STAGE_COLORS[i] : "var(--text-3)", fontSize:11, fontWeight: active?600:400, cursor:"pointer" }}>
                        {s}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Tabs */}
              <div style={{ display:"flex", borderBottom:"1px solid var(--border-light)", flexShrink:0, background:"var(--cream-mid)" }}>
                {[["notes","📝 Notes"],["nextstep","⚡ Next Step"],["contact","👤 Contact"]].map(([key,label]) => (
                  <button key={key} className="tab-btn" onClick={()=>setActiveTab(key)}
                    style={{ flex:1, background:"none", border:"none", borderBottom:`2px solid ${activeTab===key ? stageColor : "transparent"}`, color: activeTab===key ? "var(--text-1)" : "var(--text-3)", padding:"9px 0", fontSize:12, fontWeight: activeTab===key?600:400, cursor:"pointer" }}>
                    {label}
                  </button>
                ))}
              </div>

              {/* Tab body */}
              <div style={{ flex:1, overflowY:"auto", padding:"16px 18px", background:"var(--white)" }}>

                {/* NOTES */}
                {activeTab==="notes" && (
                  <div>
                    <textarea ref={noteRef} value={newNote} onChange={e=>setNewNote(e.target.value)}
                      onKeyDown={e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) addNote(); }}
                      placeholder="Add a note… (⌘↵ to save)" rows={3}
                      style={{ width:"100%", background:"var(--cream)", border:"1px solid var(--border)", borderRadius:8, padding:"9px 12px", color:"var(--text-1)", fontSize:13, lineHeight:1.55, marginBottom:8 }} />
                    <button onClick={addNote} disabled={!newNote.trim()}
                      style={{ width:"100%", background: newNote.trim() ? "var(--text-1)" : "var(--cream-dark)", color: newNote.trim() ? "var(--white)" : "var(--text-4)", border:"none", borderRadius:7, padding:"8px", fontSize:12, fontWeight:600, cursor: newNote.trim()?"pointer":"default", marginBottom:18 }}>
                      Save Note
                    </button>
                    {(deal.notes||[]).length===0 && <div style={{ color:"var(--text-4)", fontSize:12, textAlign:"center", marginTop:24, fontStyle:"italic" }}>No notes yet</div>}
                    {(deal.notes||[]).map(note => (
                      <div key={note.id} className="note-row" style={{ marginBottom:8, padding:"10px 12px", background:"var(--cream)", borderRadius:8, border:"1px solid var(--border-light)" }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5 }}>
                          <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                            <span style={{ fontSize:10, fontFamily:"'DM Mono',monospace", color:"var(--text-3)" }}>{noteFmt(note.ts)}</span>
                            {note.stage && <span style={{ fontSize:9, color:"var(--text-3)", background:"var(--cream-dark)", borderRadius:4, padding:"1px 5px", border:"1px solid var(--border-light)" }}>{note.stage}</span>}
                          </div>
                          <button className="note-del" onClick={()=>upd(deal.id,{notes:(deal.notes||[]).filter(n=>n.id!==note.id)})}
                            style={{ background:"none", border:"none", color:"var(--text-3)", fontSize:14, cursor:"pointer", padding:"0 2px" }}>×</button>
                        </div>
                        <div style={{ fontSize:13, color:"var(--text-2)", lineHeight:1.55, whiteSpace:"pre-wrap" }}>{note.text}</div>
                      </div>
                    ))}
                  </div>
                )}

                {/* NEXT STEP */}
                {activeTab==="nextstep" && (
                  <div>
                    {deal.nextStep && !nsDraft ? (
                      <div style={{ padding:"14px", background:"var(--cream)", border:`1px solid ${isOverdue(deal.nextStep.reminderAt)?"#FECACA":"var(--border)"}`, borderRadius:10, marginBottom:12 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                          <span style={{ fontSize:20 }}>{(STEP_TYPES.find(t=>t.key===deal.nextStep.type)||{}).icon}</span>
                          <span style={{ fontFamily:"'Libre Baskerville',serif", fontWeight:700, fontSize:15, color:"var(--text-1)" }}>{(STEP_TYPES.find(t=>t.key===deal.nextStep.type)||{}).label}</span>
                        </div>
                        {deal.nextStep.note && <div style={{ fontSize:13, color:"var(--text-2)", marginBottom:8, lineHeight:1.45 }}>{deal.nextStep.note}</div>}
                        {deal.nextStep.reminderAt && (
                          <div style={{ fontSize:12, color: isOverdue(deal.nextStep.reminderAt)?"#B91C1C":"var(--text-3)", display:"flex", alignItems:"center", gap:5 }}>
                            <span>{isOverdue(deal.nextStep.reminderAt)?"⚠":"🕐"}</span>
                            <span>{fmtDate(deal.nextStep.reminderAt)}</span>
                          </div>
                        )}
                        <div style={{ display:"flex", gap:7, marginTop:12 }}>
                          <button onClick={()=>setNsDraft(Object.assign({},deal.nextStep))}
                            style={{ flex:1, background:"var(--white)", border:"1px solid var(--border)", borderRadius:7, padding:"7px", color:"var(--text-2)", fontSize:12, fontWeight:500, cursor:"pointer" }}>Edit</button>
                          <button onClick={clearNs}
                            style={{ padding:"7px 14px", background:"#FEE2E2", border:"1px solid #FECACA", borderRadius:7, color:"#B91C1C", fontSize:12, fontWeight:500, cursor:"pointer" }}>Clear</button>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <Label>Action Type</Label>
                        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:16 }}>
                          {STEP_TYPES.map(t => {
                            const active = (nsDraft||deal.nextStep)?.type===t.key;
                            return (
                              <button key={t.key} onClick={()=>setNsDraft(d=>Object.assign({},d||{},{type:t.key}))}
                                style={{ padding:"6px 11px", borderRadius:7, border:`1px solid ${active?stageColor:"var(--border)"}`, background: active?STAGE_BG[deal.stage]||"var(--cream)":"var(--white)", color: active?stageColor:"var(--text-2)", fontSize:12, fontWeight: active?600:400, cursor:"pointer", display:"flex", alignItems:"center", gap:5 }}>
                                {t.icon} {t.label}
                              </button>
                            );
                          })}
                        </div>
                        <Label>Details</Label>
                        <textarea value={(nsDraft||{}).note||""} onChange={e=>setNsDraft(d=>Object.assign({},d||{},{note:e.target.value}))}
                          placeholder="What needs to happen?" rows={2}
                          style={{ width:"100%", background:"var(--cream)", border:"1px solid var(--border)", borderRadius:8, padding:"9px 12px", color:"var(--text-1)", fontSize:13, lineHeight:1.5, marginBottom:14 }} />
                        <Label>Reminder</Label>
                        <input type="datetime-local" value={(nsDraft||{}).reminderAt||""}
                          onChange={e=>setNsDraft(d=>Object.assign({},d||{},{reminderAt:e.target.value}))}
                          style={{ width:"100%", background:"var(--cream)", border:"1px solid var(--border)", borderRadius:8, padding:"9px 12px", color:"var(--text-1)", fontSize:13, marginBottom:16 }} />
                        <div style={{ display:"flex", gap:7 }}>
                          <button onClick={saveNs} disabled={!nsDraft?.type}
                            style={{ flex:1, background: nsDraft?.type?"var(--text-1)":"var(--cream-dark)", color: nsDraft?.type?"var(--white)":"var(--text-4)", border:"none", borderRadius:8, padding:"9px", fontSize:13, fontWeight:600, cursor: nsDraft?.type?"pointer":"default" }}>
                            Save Next Step
                          </button>
                          {nsDraft && deal.nextStep && (
                            <button onClick={()=>setNsDraft(null)}
                              style={{ padding:"9px 12px", background:"var(--white)", border:"1px solid var(--border)", borderRadius:8, color:"var(--text-2)", fontSize:13, cursor:"pointer" }}>Cancel</button>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* CONTACT */}
                {activeTab==="contact" && (
                  <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
                    {[
                      { label:"Name",       field:"name",     icon:"👤" },
                      { label:"Business",   field:"business", icon:"🏢" },
                      { label:"Phone",      field:"phone",    icon:"📞", type:"tel" },
                      { label:"Email",      field:"email",    icon:"✉️",  type:"email" },
                      { label:"Deal Value", field:"value",    icon:"💰", type:"number", mono:true },
                    ].map(({label,field,icon,type,mono}) => (
                      <div key={field}>
                        <Label>{icon} {label}</Label>
                        <FieldInput type={type} value={deal[field]} mono={mono}
                          onChange={e=>upd(deal.id,{[field]: field==="value"?(parseFloat(e.target.value)||0):e.target.value})} />
                      </div>
                    ))}
                    <div>
                      <Label>🎯 Deal Type</Label>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                        {DEAL_TYPES.map(t => {
                          const active = deal.dealType===t.key;
                          return (
                            <button key={t.key} onClick={()=>upd(deal.id,{dealType: active?"":t.key})}
                              style={{ padding:"5px 10px", borderRadius:6, border:`1px solid ${active?t.color:"var(--border)"}`, background: active?t.bg:"var(--white)", color: active?t.color:"var(--text-2)", fontSize:11, fontWeight: active?600:400, cursor:"pointer" }}>
                              {t.icon} {t.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                    <div style={{ borderTop:"1px solid var(--border-light)", paddingTop:16, marginTop:4 }}>
                      <button onClick={()=>del(deal.id)}
                        style={{ width:"100%", background:"#FEE2E2", color:"#B91C1C", border:"1px solid #FECACA", borderRadius:8, padding:"9px", fontSize:13, fontWeight:500, cursor:"pointer" }}>
                        Delete Deal
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {/* ── ADD LEAD MODAL ── */}
        {showForm && (
          <div style={{ position:"fixed", inset:0, background:"rgba(28,25,23,0.4)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:300, backdropFilter:"blur(6px)" }}>
            <div style={{ background:"var(--white)", border:"1px solid var(--border)", borderRadius:16, padding:"28px 28px 24px", width:400, boxShadow:"var(--shadow-lg)" }}>
              <div style={{ fontFamily:"'Libre Baskerville',serif", fontWeight:700, fontSize:19, marginBottom:20, color:"var(--text-1)", letterSpacing:"-0.3px" }}>New Lead</div>
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                {[
                  { key:"name",     label:"Name *",   placeholder:"Full name",         ref:nameRef },
                  { key:"business", label:"Business", placeholder:"Company name" },
                  { key:"phone",    label:"Phone",    placeholder:"(415) 000-0000",    type:"tel" },
                  { key:"email",    label:"Email",    placeholder:"email@domain.com",  type:"email" },
                ].map(({key,label,placeholder,type,ref}) => (
                  <div key={key}>
                    <Label>{label}</Label>
                    <FieldInput inputRef={ref} type={type} value={form[key]} placeholder={placeholder}
                      onChange={e=>setForm(f=>Object.assign({},f,{[key]:e.target.value}))}
                      onKeyDown={e=>e.key==="Enter"&&addDeal()} />
                  </div>
                ))}
                <div>
                  <Label>Deal Value</Label>
                  <FieldInput type="number" value={form.value} placeholder="0" mono
                    onChange={e=>setForm(f=>Object.assign({},f,{value:e.target.value}))}
                    onKeyDown={e=>e.key==="Enter"&&addDeal()} />
                </div>
                <div>
                  <Label>Deal Type</Label>
                  <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                    {DEAL_TYPES.map(t => (
                      <button key={t.key} onClick={()=>setFormType(formType===t.key?"":t.key)}
                        style={{ padding:"5px 9px", borderRadius:6, border:`1px solid ${formType===t.key?t.color:"var(--border)"}`, background: formType===t.key?t.bg:"var(--white)", color: formType===t.key?t.color:"var(--text-2)", fontSize:11, fontWeight: formType===t.key?600:400, cursor:"pointer" }}>
                        {t.icon} {t.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <Label>Stage</Label>
                  <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                    {stages.map((s,i) => (
                      <button key={i} onClick={()=>setFormStage(i)}
                        style={{ padding:"5px 10px", borderRadius:6, border:`1px solid ${formStage===i?STAGE_COLORS[i]:"var(--border)"}`, background: formStage===i?STAGE_BG[i]:"var(--white)", color: formStage===i?STAGE_COLORS[i]:"var(--text-2)", fontSize:12, fontWeight: formStage===i?600:400, cursor:"pointer" }}>
                        {s}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <div style={{ display:"flex", gap:8, marginTop:22 }}>
                <button onClick={addDeal} style={{ flex:1, background:"#C96A1F", color:"#FFFFFF", border:"none", borderRadius:8, padding:"11px", fontSize:13, fontWeight:600, cursor:"pointer", letterSpacing:"0.1px", boxShadow:"0 1px 4px rgba(201,106,31,0.35)" }}>Add Lead</button>
                <button onClick={()=>setShowForm(false)} style={{ padding:"11px 16px", background:"var(--cream)", color:"var(--text-2)", border:"1px solid var(--border)", borderRadius:8, fontSize:13, cursor:"pointer" }}>Cancel</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Pipeline));
</script>
</body>
</html>
